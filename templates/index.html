<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ asset('app.css') }}">
<link rel="stylesheet" href="{{ asset('companion.css') }}">
<script>
  try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body data-name="{{ name }}">
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mark" id="brand-mark"></div>
      <div><b>{{ name }}</b><small>reads your PDFs</small></div>
    </div>
    <nav class="nav">
      <div class="side-label">Workspace</div>
      <a class="nav-item" href="#/upload" data-route="upload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>
        Upload
      </a>
      <a class="nav-item" href="#/profiles" data-route="profiles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>
        Profiles
      </a>
      <a class="nav-item" href="#/library" data-route="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h3v15M8 19h4V4h-4M12 19h4V6h-4M16 19l3.5-.9L16.6 5.2 13 6"/></svg>
        Library
      </a>
    </nav>
    <div class="co-list" id="side-profiles"></div>
    <div class="side-foot">
      <span class="st s-recv" id="llm-status"><span class="d"></span><span>checking…</span></span>
      <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="crumb" id="crumb"><b>{{ name }}</b></div>
      <label class="search" id="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="search-input" placeholder="Search library" autocomplete="off">
      </label>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<script src="{{ asset('vendor/lottie.min.js') }}"></script>
<script src="{{ asset('robot.js') }}"></script>
<script src="{{ asset('world.js') }}"></script>
<script src="{{ asset('companion.js') }}"></script>
<script src="{{ asset('app.js') }}"></script>
</body>
</html>
