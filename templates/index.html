<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ asset('css/base.css') }}">
<link rel="stylesheet" href="{{ asset('css/shell.css') }}">
<link rel="stylesheet" href="{{ asset('css/companion.css') }}">
<link rel="stylesheet" href="{{ asset('css/chat.css') }}">
<link rel="stylesheet" href="{{ asset('css/sheet.css') }}">
<link rel="stylesheet" href="{{ asset('css/pages/builder.css') }}">
<link rel="stylesheet" href="{{ asset('css/pages/profiles.css') }}">
<link rel="stylesheet" href="{{ asset('css/pages/library.css') }}">
<script>
  try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body data-name="{{ name }}">
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mark" id="brand-mark"></div>
      <div><b>{{ name }}</b><small>reads your PDFs</small></div>
    </div>
    <nav class="nav">
      <div class="side-label">Workspace</div>
      <a class="nav-item" href="#/builder" data-route="builder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>
        Profile Builder
      </a>
      <a class="nav-item" href="#/profiles" data-route="profiles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>
        Profiles
      </a>
      <a class="nav-item" href="#/library" data-route="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h3v15M8 19h4V4h-4M12 19h4V6h-4M16 19l3.5-.9L16.6 5.2 13 6"/></svg>
        Library
      </a>
    </nav>
    <div class="co-list" id="side-profiles"></div>
    <div class="side-foot">
      <div class="status-stack">
        <span class="st s-recv" id="llm-status"><span class="d"></span><span>checking…</span></span>
        <span class="st s-recv" id="db-status"><span class="d"></span><span>checking…</span></span>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="crumb" id="crumb"><b>{{ name }}</b></div>
      <label class="search" id="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="search-input" placeholder="Search library" autocomplete="off">
      </label>
      <div class="avatar-pick" id="avatar-pick" role="radiogroup" aria-label="Avatar">
        <button type="button" role="radio" data-skin="classic" title="Dot" aria-label="Dot"></button>
        <button type="button" role="radio" data-skin="ironman" title="Iron Man" aria-label="Iron Man"></button>
      </div>
      <button class="theme-switch" id="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode" title="Dark mode">
        <span class="thumb">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </span>
      </button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<script src="{{ asset('js/companion/robot.js') }}"></script>
<script src="{{ asset('js/companion/world.js') }}"></script>
<script src="{{ asset('js/companion/companion.js') }}"></script>
<script type="module" src="{{ asset('js/main.js') }}"></script>
</body>
</html>
